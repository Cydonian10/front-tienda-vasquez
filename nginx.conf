server {
    listen 8080;
    server_name _;

    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # HTML: revalidar para obtener la versión actual
    location = /tienda {
        return 301 /tienda/;
    }

    location = /tienda/index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    }

    # JS y CSS: archivos con hash de Angular
    location ~* ^/tienda/.*\.(js|mjs|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rutas de Angular
    location /tienda/ {
        try_files $uri $uri/ /tienda/index.html;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    }

    location / {
        return 404;
    }
}
