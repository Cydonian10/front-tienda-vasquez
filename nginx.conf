server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTML: revalidar para obtener la versión actual
    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    }

    # JS y CSS: archivos con hash de Angular
    location ~* \.(js|mjs|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rutas de Angular
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate";
    }
}